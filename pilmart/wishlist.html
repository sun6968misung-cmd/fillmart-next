<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 찜 — 필마트</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary:'#1a3d8f', accent:'#e8001d', brand:{ light:'#e8f0fe', dark:'#0f2460' } } } }
    }
  </script>
  <script src="js/products.js"></script>
  <script src="js/store.js"></script>

  <style>[x-cloak]{display:none!important;} body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="wishlistApp()" x-cloak>

<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="index.html" class="text-primary hover:text-brand-dark">
      <i class="fas fa-arrow-left text-lg"></i>
    </a>
    <a href="index.html">
      <svg viewBox="0 0 240 52" class="h-9" xmlns="http://www.w3.org/2000/svg">
        <text x="2" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#1a3d8f">FILL</text>
        <circle cx="132" cy="26" r="21" fill="#e8001d"/>
        <text x="132" y="34" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="23" font-weight="900" fill="white">M</text>
        <text x="156" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#e8001d">ART</text>
      </svg>
    </a>
    <h1 class="text-lg font-bold text-gray-800 ml-1">나의 찜</h1>
    <span class="text-sm text-gray-400" x-text="wishItems.length + '개'"></span>
  </div>
</header>

<main class="max-w-screen-xl mx-auto px-4 py-8">

  <!-- 비어있을 때 -->
  <div x-show="wishItems.length === 0" class="text-center py-24">
    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fas fa-heart text-3xl text-gray-300"></i>
    </div>
    <p class="text-gray-500 font-medium mb-6">찜한 상품이 없습니다</p>
    <a href="index.html"
       class="inline-block bg-primary text-white font-bold px-8 py-3 rounded-xl hover:bg-brand-dark transition-colors">
      <i class="fas fa-store mr-2"></i>쇼핑 시작하기
    </a>
  </div>

  <!-- 찜 목록 -->
  <div x-show="wishItems.length > 0">
    <div class="flex items-center justify-between mb-5">
      <p class="text-sm text-gray-500">찜한 상품 <span class="font-bold text-gray-800" x-text="wishItems.length"></span>개</p>
      <button @click="clearAll()" class="text-sm text-gray-400 hover:text-red-500 transition-colors">
        <i class="fas fa-trash-alt mr-1"></i>전체 삭제
      </button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <template x-for="p in wishItems" :key="p.id">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-md transition-shadow">

          <!-- 이미지 -->
          <div class="relative cursor-pointer" @click="location.href='product.html?id='+p.id"
               style="position:relative;width:100%;padding-bottom:100%;overflow:hidden;background:#f8f8f8;">
            <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;">
              <img :src="imgUrl(p.id)" :alt="p.name" loading="lazy"
                   style="width:100%;height:100%;object-fit:contain;"
                   @error="$el.style.display='none';$el.nextElementSibling.style.display='flex'">
              <div style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;align-items:center;justify-content:center;font-size:2.5rem;background:#f8f8f8;"
                   x-text="p.emoji"></div>
            </div>
            <!-- 찜 해제 버튼 -->
            <button @click.stop="removeWish(p.id)"
                    style="position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(232,0,29,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;">
              <i class="fas fa-heart text-white" style="font-size:13px;"></i>
            </button>
            <!-- 할인 뱃지 -->
            <span x-show="p.originalPrice"
                  style="position:absolute;top:0;left:0;background:#e8001d;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;"
                  x-text="Math.round((1 - p.price/p.originalPrice)*100) + '%'"></span>
          </div>

          <!-- 정보 -->
          <div class="p-3">
            <p class="text-xs text-gray-700 mb-1 leading-snug line-clamp-2" x-text="p.name"></p>
            <p x-show="p.originalPrice" class="text-xs text-gray-400 line-through" x-text="p.originalPrice?.toLocaleString('ko-KR') + '원'"></p>
            <p class="text-sm font-black text-gray-900" x-text="p.price.toLocaleString('ko-KR') + '원'"></p>
            <button @click="addCart(p)"
                    class="mt-2 w-full bg-accent text-white text-xs font-bold py-2 rounded-lg hover:bg-red-700 transition-colors">
              <i class="fas fa-shopping-cart mr-1"></i>담기
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

</main>

  function wishlistApp() {
    return {
      wishItems: [],

      init() {
        this.refresh();
      },

      refresh() {
        applyProductOverrides();
        const ids = JSON.parse(localStorage.getItem('pilmart_wishlist') || '[]');
        this.wishItems = ids.map(id => {
          const base = PRODUCTS.find(p => p.id === id);
          return base ? { ...base } : null;
        }).filter(Boolean);
      },

      imgUrl(id) {
        return getProductImage(id);
      },

      removeWish(id) {
        Alpine.store('wishlist').ids = Alpine.store('wishlist').ids.filter(x => x !== id);
        Alpine.store('wishlist').persist();
        this.refresh();
      },

      addCart(p) {
        Alpine.store('cart').addToCart(p);
      },

      clearAll() {
        if (!confirm('찜 목록을 모두 삭제할까요?')) return;
        Alpine.store('wishlist').ids = [];
        Alpine.store('wishlist').persist();
        this.wishItems = [];
      }
    };
  }
</script>
</body>
</html>
