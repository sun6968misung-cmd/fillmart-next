<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 내역 — 필마트</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#1a3d8f', accent: '#e8001d', brand: { light: '#e8f0fe', dark: '#0f2460' } } } }
    }
  </script>
  <script src="js/store.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @media print {
      body > * { display: none !important; }
      #printArea { display: block !important; }
      #printArea { position: fixed; inset: 0; padding: 32px; background: #fff; }
    }
  </style>
</head>
<body x-data="ordersApp()" x-cloak class="bg-gray-50 font-sans min-h-screen">

<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-4">
    <a href="index.html" class="text-primary hover:text-brand-dark transition-colors">
      <i class="fas fa-arrow-left text-lg"></i>
    </a>
    <a href="index.html" class="flex-shrink-0">
      <img src="images/logo.svg" class="h-9" alt="FILLMART">
    </a>
    <h1 class="text-lg font-bold text-gray-800 ml-1">주문 내역</h1>
  </div>
</header>

<main class="max-w-lg mx-auto px-4 py-8">

  <!-- 주문 없을 때 -->
  <div x-show="orders.length === 0" class="text-center py-24">
    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fas fa-receipt text-3xl text-gray-300"></i>
    </div>
    <p class="text-gray-500 font-medium mb-6">아직 주문 내역이 없습니다</p>
    <a href="index.html"
       class="inline-block bg-primary text-white font-bold px-8 py-3 rounded-xl hover:bg-brand-dark transition-colors">
      <i class="fas fa-store mr-2"></i>쇼핑 시작하기
    </a>
  </div>

  <!-- 주문 목록 -->
  <div x-show="orders.length > 0" class="space-y-4">
    <p class="text-sm text-gray-400 mb-2">최근 주문 <span x-text="orders.length"></span>건</p>

    <template x-for="(order, i) in orders" :key="i">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

        <!-- 주문 헤더 -->
        <div class="px-5 py-4">
          <div class="flex items-start justify-between mb-3">
            <div>
              <p class="text-xs text-gray-400 mb-0.5" x-text="fmt(order.date)"></p>
              <p class="font-mono text-sm font-semibold text-gray-800" x-text="order.orderId"></p>
            </div>
            <div class="flex items-center gap-1.5">
              <!-- 결제 유형 -->
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full"
                    :class="order.type === 'meet' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'"
                    x-text="order.type === 'meet' ? '만나서결제' : '온라인결제'">
              </span>
              <!-- 주문 상태 뱃지 -->
              <span class="text-xs font-bold px-2.5 py-1 rounded-full"
                    :class="statusClass(order.status)"
                    x-text="order.status || '결제완료'">
              </span>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="space-y-1">
              <div class="flex items-center gap-2 text-sm text-gray-600">
                <i class="fas fa-credit-card text-gray-400 w-4 text-center"></i>
                <span x-text="methodLabel(order.paymentMethod)"></span>
              </div>
              <div class="flex items-center gap-2 text-sm font-black text-accent">
                <i class="fas fa-won-sign text-gray-400 w-4 text-center"></i>
                <span x-text="Number(order.amount).toLocaleString('ko-KR') + '원'"></span>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <!-- 취소 버튼 (결제완료/준비중일 때만) -->
              <button x-show="canCancel(order.status)"
                      @click="cancelOrder(i)"
                      class="text-xs text-gray-400 hover:text-red-500 border border-gray-200 hover:border-red-300 px-2.5 py-1 rounded-full transition-colors">
                주문취소
              </button>
              <!-- 상세/출력 버튼 -->
              <button @click="viewOrder(order)"
                      class="flex items-center gap-1 text-xs text-primary font-semibold hover:text-brand-dark border border-primary/30 hover:border-primary px-2.5 py-1 rounded-full transition-colors">
                <i class="fas fa-file-alt text-xs"></i> 상세/출력
              </button>
            </div>
          </div>
        </div>

        <!-- 상품 목록 (펼쳐짐) -->
        <div x-show="expanded[i]" x-transition
             class="border-t border-gray-100 px-5 py-3 bg-gray-50 space-y-2">
          <template x-for="item in order.items" :key="item.id">
            <div class="flex items-center justify-between text-sm">
              <div class="flex items-center gap-2">
                <span x-text="item.emoji" class="text-base"></span>
                <span class="text-gray-700" x-text="item.name"></span>
              </div>
              <span class="text-gray-500 flex-shrink-0 ml-2"
                    x-text="'× ' + item.qty + ' · ' + (item.price * item.qty).toLocaleString('ko-KR') + '원'">
              </span>
            </div>
          </template>
        </div>

      </div>
    </template>

    <!-- 전체 삭제 -->
    <button @click="clearAll()"
            class="w-full mt-4 text-sm text-gray-400 hover:text-red-500 transition-colors py-2">
      <i class="fas fa-trash-alt mr-1"></i>전체 내역 삭제
    </button>
  </div>

</main>

<!-- ── 주문 상세 모달 ── -->
<div x-show="viewingOrder" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     @keydown.escape.window="viewingOrder = null">
  <div class="absolute inset-0 bg-black/50" @click="viewingOrder = null"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden max-h-[90vh] flex flex-col">

    <!-- 모달 헤더 -->
    <div class="bg-primary px-6 py-4 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-3 text-white">
        <i class="fas fa-receipt"></i>
        <span class="font-bold">주문 상세내역</span>
      </div>
      <button @click="viewingOrder = null" class="text-white/70 hover:text-white transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <!-- 스크롤 가능한 본문 -->
    <div class="overflow-y-auto flex-1 p-6">
      <template x-if="viewingOrder">
        <div>
          <!-- 로고 + 상점명 -->
          <div class="text-center mb-5 pb-4 border-b border-gray-100">
            <img src="images/logo.svg" class="h-8 mx-auto mb-1" alt="FILLMART">
            <p class="text-xs text-gray-400">구미 인동점 · 054-473-2841</p>
          </div>

          <!-- 주문 정보 -->
          <div class="space-y-2 mb-5">
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">주문번호</span>
              <span class="font-mono font-semibold text-gray-800" x-text="viewingOrder.orderId"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">주문일시</span>
              <span class="text-gray-700" x-text="fmt(viewingOrder.date)"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">결제수단</span>
              <span class="text-gray-700" x-text="methodLabel(viewingOrder.paymentMethod)"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">결제유형</span>
              <span class="font-semibold"
                    :class="viewingOrder.type === 'meet' ? 'text-yellow-600' : 'text-green-600'"
                    x-text="viewingOrder.type === 'meet' ? '만나서결제' : '온라인결제'"></span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">주문상태</span>
              <span class="font-bold px-2 py-0.5 rounded-full text-xs"
                    :class="statusClass(viewingOrder.status)"
                    x-text="viewingOrder.status || '결제완료'"></span>
            </div>
          </div>

          <!-- 주문 상품 -->
          <div class="border-t border-dashed border-gray-200 pt-4 mb-4">
            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">주문 상품</p>
            <template x-if="viewingOrder.items && viewingOrder.items.length > 0">
              <div class="space-y-2">
                <template x-for="item in viewingOrder.items" :key="item.id">
                  <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                      <span x-text="item.emoji" class="text-base flex-shrink-0"></span>
                      <span class="text-gray-700 truncate" x-text="item.name"></span>
                      <span class="text-gray-400 flex-shrink-0" x-text="'× ' + item.qty"></span>
                    </div>
                    <span class="font-semibold text-gray-800 flex-shrink-0 ml-3"
                          x-text="(item.price * item.qty).toLocaleString('ko-KR') + '원'"></span>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!viewingOrder.items || viewingOrder.items.length === 0">
              <p class="text-xs text-gray-400 text-center py-2">상품 정보 없음</p>
            </template>
          </div>

          <!-- 결제 합계 -->
          <div class="border-t border-dashed border-gray-200 pt-4 space-y-1.5">
            <div class="flex justify-between text-sm text-gray-500">
              <span>상품 합계</span>
              <span x-text="(viewingOrder.items || []).reduce((s,i) => s + i.price * i.qty, 0).toLocaleString('ko-KR') + '원'"></span>
            </div>
            <div class="flex justify-between text-sm text-gray-500">
              <span>배송비</span>
              <span class="text-green-600 font-medium">무료</span>
            </div>
            <div class="flex justify-between text-base font-black pt-2 border-t border-gray-200">
              <span class="text-gray-800">결제금액</span>
              <span class="text-accent" x-text="Number(viewingOrder.amount).toLocaleString('ko-KR') + '원'"></span>
            </div>
          </div>

          <!-- 안내문 -->
          <p class="text-[11px] text-gray-400 text-center mt-5 leading-relaxed">
            문의: 054-473-2841 · 평일·주말 09:00~22:00<br>
            신선식품 특성상 단순 변심 반품은 제한될 수 있습니다.
          </p>
        </div>
      </template>
    </div>

    <!-- 모달 푸터 (버튼) -->
    <div class="flex gap-2 p-4 border-t border-gray-100 flex-shrink-0 bg-gray-50">
      <button @click="printOrder()"
              class="flex-1 bg-primary text-white font-bold py-2.5 rounded-xl hover:bg-brand-dark transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-print"></i> 인쇄
      </button>
      <button @click="viewingOrder = null"
              class="flex-1 border border-gray-200 text-gray-600 font-semibold py-2.5 rounded-xl hover:bg-gray-100 transition-colors">
        닫기
      </button>
    </div>
  </div>
</div>

<!-- 인쇄 전용 영역 (화면에는 숨김) -->
<div id="printArea" style="display:none;"></div>

<script>
  function ordersApp() {
    return {
      orders: [],
      expanded: {},
      viewingOrder: null,

      init() {
        this.orders = JSON.parse(localStorage.getItem('pilmart_orders') || '[]');
      },

      toggle(i) {
        this.expanded[i] = !this.expanded[i];
      },

      fmt(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleString('ko-KR', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });
      },

      methodLabel(m) {
        const map = {
          'card': '온라인 카드',
          'transfer': '계좌이체',
          'meet_card': '만나서 카드',
          'meet_cash': '만나서 현금',
          '카드': '만나서 카드',
          '현금': '만나서 현금'
        };
        return map[m] || m || '-';
      },

      statusClass(status) {
        const map = {
          '결제완료': 'bg-blue-100 text-blue-700',
          '준비중':   'bg-orange-100 text-orange-700',
          '배송중':   'bg-purple-100 text-purple-700',
          '완료':     'bg-gray-100 text-gray-600',
          '취소':     'bg-red-100 text-red-500',
        };
        return map[status] || 'bg-blue-100 text-blue-700';
      },

      canCancel(status) {
        return !status || status === '결제완료' || status === '준비중';
      },

      viewOrder(order) {
        this.viewingOrder = order;
      },

      printOrder() {
        if (!this.viewingOrder) return;
        const o = this.viewingOrder;
        const methodMap = { card:'온라인 카드', transfer:'계좌이체', meet_card:'만나서 카드', meet_cash:'만나서 현금', '카드':'만나서 카드', '현금':'만나서 현금' };
        const statusColorMap = { '결제완료':'#1d4ed8', '준비중':'#c2410c', '배송중':'#7e22ce', '완료':'#4b5563', '취소':'#dc2626' };
        const status = o.status || '결제완료';
        const items = o.items || [];
        const itemsHtml = items.map(i => `
          <tr>
            <td style="padding:6px 0;color:#374151;">${i.emoji} ${i.name}</td>
            <td style="padding:6px 0;text-align:center;color:#6b7280;">× ${i.qty}</td>
            <td style="padding:6px 0;text-align:right;font-weight:700;color:#111;">${(i.price * i.qty).toLocaleString('ko-KR')}원</td>
          </tr>`).join('');
        const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
        const deliveryFee = '무료';
        const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
          <title>주문 상세 - ${o.orderId}</title>
          <style>
            body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; max-width: 480px; margin: 0 auto; color: #111; }
            h1 { font-size: 22px; font-weight: 900; color: #1a3d8f; margin: 0 0 4px; }
            .sub { font-size: 12px; color: #888; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; }
            .info-table td { padding: 5px 0; font-size: 13px; }
            .info-table td:first-child { color: #888; width: 90px; }
            hr { border: none; border-top: 1px dashed #ddd; margin: 16px 0; }
            .items-table td { font-size: 13px; }
            .total-row td { font-size: 15px; font-weight: 900; border-top: 2px solid #111; padding-top: 8px; }
            .total-row td:last-child { color: #e8001d; }
            .footer { font-size: 11px; color: #aaa; text-align: center; margin-top: 24px; line-height: 1.8; }
            @media print { @page { margin: 20mm; } }
          </style>
        </head><body>
          <h1>FILLMART</h1>
          <p class="sub">구미 인동점 · 054-473-2841</p>
          <hr>
          <table class="info-table">
            <tr><td>주문번호</td><td><strong>${o.orderId}</strong></td></tr>
            <tr><td>주문일시</td><td>${new Date(o.date).toLocaleString('ko-KR')}</td></tr>
            <tr><td>결제수단</td><td>${methodMap[o.paymentMethod] || o.paymentMethod || '-'}</td></tr>
            <tr><td>결제유형</td><td>${o.type === 'meet' ? '만나서결제' : '온라인결제'}</td></tr>
            <tr><td>주문상태</td><td><strong style="color:${statusColorMap[status] || '#1d4ed8'}">${status}</strong></td></tr>
          </table>
          <hr>
          <p style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px;">주문 상품</p>
          <table class="items-table">${itemsHtml}</table>
          <hr>
          <table>
            <tr><td style="color:#888;font-size:13px;">상품 합계</td><td style="text-align:right;font-size:13px;">${subtotal.toLocaleString('ko-KR')}원</td></tr>
            <tr><td style="color:#888;font-size:13px;">배송비</td><td style="text-align:right;font-size:13px;">${deliveryFee}</td></tr>
          </table>
          <table><tr class="total-row"><td>결제금액</td><td style="text-align:right;">${Number(o.amount).toLocaleString('ko-KR')}원</td></tr></table>
          <p class="footer">문의: 054-473-2841 · 평일·주말 09:00~22:00<br>감사합니다. 신선하고 건강한 식탁을 응원합니다!</p>
        </body></html>`;
        const win = window.open('', '_blank', 'width=600,height=700');
        win.document.write(html);
        win.document.close();
        win.focus();
        setTimeout(() => win.print(), 400);
      },

      cancelOrder(i) {
        if (!confirm('주문을 취소할까요?')) return;
        this.orders[i].status = '취소';
        if (this.viewingOrder && this.viewingOrder === this.orders[i]) {
          this.viewingOrder = { ...this.orders[i] };
        }
        localStorage.setItem('pilmart_orders', JSON.stringify(this.orders));
      },

      clearAll() {
        if (!confirm('주문 내역을 모두 삭제할까요?')) return;
        localStorage.removeItem('pilmart_orders');
        this.orders = [];
        this.expanded = {};
        this.viewingOrder = null;
      }
    };
  }
</script>

</body>
</html>
