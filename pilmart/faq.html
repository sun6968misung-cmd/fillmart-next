<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자주하는 질문 - 필마트</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary:'#1a3d8f', accent:'#e8001d', brand:{ light:'#e8f0fe', dark:'#0f2460' } } } }
    }
  </script>
  <script src="js/store.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important;}
    body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
  </style>
</head>
<body class="bg-[#f5f5f5]" x-data="faqApp()" x-cloak>

<!-- 상단 공지 바 -->
<div class="bg-accent text-white text-center text-sm py-2.5 font-semibold">
  주문금액 제한없는 <strong>당일배송</strong>&nbsp;·&nbsp;구미 인동점
  <i class="fas fa-phone-alt ml-3 mr-1 opacity-80 text-xs"></i>054-473-2841
</div>

<!-- 헤더 -->
<header class="bg-white border-b border-gray-200">
  <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="index.html" class="flex-shrink-0">
      <svg viewBox="0 0 240 52" class="h-10" xmlns="http://www.w3.org/2000/svg">
        <text x="2" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#1a3d8f">FILL</text>
        <circle cx="132" cy="26" r="21" fill="#e8001d"/>
        <text x="132" y="34" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="23" font-weight="900" fill="white">M</text>
        <text x="156" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#e8001d">ART</text>
      </svg>
    </a>
    <div class="flex-1"></div>
    <a href="index.html" class="text-sm text-gray-500 hover:text-accent transition-colors flex items-center gap-1">
      <i class="fas fa-chevron-left text-xs"></i> 홈으로
    </a>
  </div>
</header>

<!-- 본문 -->
<main class="max-w-screen-md mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-2xl font-black text-gray-900 mb-1">자주하는 질문</h1>
    <p class="text-sm text-gray-400">궁금하신 사항을 빠르게 찾아보세요</p>
  </div>

  <!-- 카테고리 탭 -->
  <div class="flex gap-2 mb-6 flex-wrap">
    <template x-for="cat in categories" :key="cat">
      <button @click="activeCategory = cat"
              class="px-4 py-2 text-sm font-semibold rounded-full border transition-colors"
              :class="activeCategory === cat ? 'bg-primary text-white border-primary' : 'bg-white text-gray-600 border-gray-200 hover:border-primary hover:text-primary'"
              x-text="cat"></button>
    </template>
  </div>

  <!-- FAQ 아코디언 -->
  <div class="space-y-2">
    <template x-for="(item, i) in filteredFaqs()" :key="i">
      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <button @click="toggle(i)"
                class="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-gray-50 transition-colors">
          <div class="flex items-start gap-3">
            <span class="text-xs font-bold text-accent bg-red-50 px-2 py-0.5 rounded flex-shrink-0 mt-0.5" x-text="item.category"></span>
            <span class="text-sm font-semibold text-gray-800" x-text="item.q"></span>
          </div>
          <i class="fas fa-chevron-down text-xs text-gray-400 flex-shrink-0 ml-3 transition-transform duration-200"
             :class="opened[i] ? 'rotate-180' : ''"></i>
        </button>
        <div x-show="opened[i]"
             x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 -translate-y-1"
             x-transition:enter-end="opacity-100 translate-y-0"
             class="px-5 pb-5 border-t border-gray-50">
          <p class="text-sm text-gray-600 leading-relaxed mt-3" x-text="item.a"></p>
        </div>
      </div>
    </template>
  </div>

  <!-- 추가 문의 -->
  <div class="mt-10 bg-brand-light rounded-2xl p-6 text-center">
    <p class="text-sm text-gray-600 mb-3">원하시는 답변을 찾지 못하셨나요?</p>
    <div class="flex justify-center gap-3 flex-wrap">
      <a href="tel:054-473-2841"
         class="inline-flex items-center gap-2 bg-primary text-white font-bold px-5 py-2.5 rounded-xl text-sm hover:bg-brand-dark transition-colors">
        <i class="fas fa-phone-alt"></i> 054-473-2841 전화 문의
      </a>
      <a href="contact.html"
         class="inline-flex items-center gap-2 border border-primary text-primary font-bold px-5 py-2.5 rounded-xl text-sm hover:bg-brand-light transition-colors">
        <i class="fas fa-envelope"></i> 1:1 문의하기
      </a>
    </div>
  </div>
</main>

<!-- 푸터 -->
<footer class="bg-white border-t border-gray-200 mt-10">
  <div class="max-w-screen-xl mx-auto px-4 py-6 text-center text-xs text-gray-400">
    Copyright © 2025 필마트 구미 인동점. All rights reserved.
    <span class="mx-2">|</span>
    <a href="terms.html" class="hover:text-accent">이용약관</a>
    <span class="mx-2">|</span>
    <a href="privacy.html" class="hover:text-accent">개인정보처리방침</a>
  </div>
</footer>

<script>
  function faqApp() {
    return {
      activeCategory: '전체',
      categories: ['전체','배송','주문/결제','상품','회원'],
      opened: {},
      faqs: [
        { category:'배송', q:'배송 가능 지역이 어디인가요?', a:'현재 경북 구미시 인동 지역 내 당일배송 서비스를 운영 중입니다. 배송 가능 지역 여부는 고객센터(054-473-2841)로 문의해 주세요.' },
        { category:'배송', q:'당일배송 주문 마감 시간은 언제인가요?', a:'오전 11시 이전 주문 건은 당일 배송됩니다. 11시 이후 주문 건은 익일 배송되며, 정확한 배송 시간은 담당자가 연락드립니다.' },
        { category:'배송', q:'배송비는 얼마인가요?', a:'최소 주문금액(100,000원) 이상 주문 시 배송비는 무료입니다.' },
        { category:'주문/결제', q:'최소 주문금액이 있나요?', a:'네, 최소 주문금액은 100,000원입니다. 미달 시 결제가 진행되지 않습니다.' },
        { category:'주문/결제', q:'어떤 결제 수단을 사용할 수 있나요?', a:'온라인 카드결제, 계좌이체, 만나서결제(카드/현금)를 지원합니다. 만나서결제는 배송 시 기사님께 직접 결제하시면 됩니다.' },
        { category:'주문/결제', q:'주문 취소는 어떻게 하나요?', a:'주문 후 준비 시작 전(결제완료 상태)에만 취소 가능합니다. 마이페이지 > 주문내역에서 취소하거나, 고객센터로 연락해 주세요.' },
        { category:'주문/결제', q:'영수증을 받을 수 있나요?', a:'마이페이지 > 주문내역에서 주문 상세 페이지의 인쇄 버튼을 눌러 영수증을 출력하실 수 있습니다.' },
        { category:'상품', q:'신선도는 어떻게 보장되나요?', a:'매일 아침 산지에서 직송하는 신선 상품만 취급합니다. 상품 수령 후 신선도에 문제가 있는 경우 당일 고객센터로 연락 주시면 교환/환불 처리해 드립니다.' },
        { category:'상품', q:'원산지 정보는 어디서 확인하나요?', a:'각 상품 상세 페이지에서 원산지, 보관방법, 단위 등 상세 정보를 확인하실 수 있습니다.' },
        { category:'상품', q:'상품 재고가 없는 경우 어떻게 되나요?', a:'재고 소진 시 담당자가 유선으로 연락드려 대체 상품을 안내하거나 해당 상품을 제외한 나머지를 배송드립니다.' },
        { category:'회원', q:'비회원도 주문할 수 있나요?', a:'주문 및 결제를 위해 회원가입이 필요합니다. 간편하게 이메일이나 소셜 계정으로 가입하실 수 있습니다.' },
        { category:'회원', q:'비밀번호를 잊어버렸어요.', a:'현재 비밀번호 찾기 기능은 고객센터(054-473-2841)를 통해 본인 확인 후 처리해 드립니다.' },
      ],
      toggle(i) { this.opened[i] = !this.opened[i]; },
      filteredFaqs() {
        if (this.activeCategory === '전체') return this.faqs;
        return this.faqs.filter(f => f.category === this.activeCategory);
      }
    };
  }
</script>
</body>
</html>
