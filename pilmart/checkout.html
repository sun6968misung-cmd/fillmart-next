<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제하기 — 필마트</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1a3d8f',
            accent:  '#e8001d',
            brand: { light: '#e8f0fe', dark: '#0f2460' }
          }
        }
      }
    }
  </script>

  <!-- 카트 스토어 (Alpine 보다 먼저) -->
  <script src="js/store.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <!-- Toss Payments SDK -->
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <!-- 다음(카카오) 우편번호 API -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .method-btn { transition: all .15s; }
    .method-btn.selected {
      border-color: #1a3d8f;
      background-color: #e8f0fe;
      color: #1a3d8f;
    }
  </style>
</head>

<body x-data="checkoutApp()" x-cloak class="bg-gray-50 font-sans min-h-screen">

<!-- 헤더 -->
<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="index.html" class="text-primary hover:text-brand-dark transition-colors">
      <i class="fas fa-arrow-left text-lg"></i>
    </a>
    <a href="index.html" class="flex-shrink-0">
      <svg viewBox="0 0 240 52" class="h-9" xmlns="http://www.w3.org/2000/svg">
        <text x="2" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#1a3d8f">FILL</text>
        <circle cx="132" cy="26" r="21" fill="#e8001d"/>
        <text x="132" y="34" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="23" font-weight="900" fill="white">M</text>
        <text x="156" y="41" font-family="Arial Black,sans-serif" font-size="38" font-weight="900" fill="#e8001d">ART</text>
      </svg>
    </a>
    <h1 class="text-lg font-bold text-gray-800 ml-1">주문 · 결제</h1>
  </div>
</header>

<!-- 빈 카트 안내 -->
<div x-show="$store.cart.count === 0" class="max-w-4xl mx-auto px-4 py-24 text-center">
  <i class="fas fa-shopping-cart text-6xl text-gray-200 mb-4"></i>
  <p class="text-gray-500 font-medium mb-6">장바구니가 비어 있습니다.</p>
  <a href="index.html" class="inline-block bg-primary text-white font-bold px-8 py-3 rounded-xl hover:bg-brand-dark transition-colors">
    쇼핑 계속하기
  </a>
</div>

<!-- 결제 폼 -->
<div x-show="$store.cart.count > 0" class="max-w-4xl mx-auto px-4 py-8">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- 왼쪽: 주문 정보 -->
    <div class="lg:col-span-2 space-y-5">

      <!-- 주문 상품 목록 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 bg-gray-50">
          <h2 class="font-bold text-gray-800 flex items-center gap-2">
            <i class="fas fa-box text-primary"></i>
            주문 상품
            <span class="text-sm text-gray-400 font-normal" x-text="'(' + $store.cart.count + '개)'"></span>
          </h2>
        </div>
        <div class="divide-y divide-gray-50 px-5">
          <template x-for="item in $store.cart.items" :key="item.id">
            <div class="flex items-center gap-3 py-3">
              <div class="w-12 h-12 rounded-lg bg-gradient-to-br from-blue-50 to-green-50 flex items-center justify-center text-xl flex-shrink-0"
                   x-text="item.emoji"></div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-800 truncate" x-text="item.name"></p>
                <p class="text-xs text-gray-400" x-text="item.price.toLocaleString('ko-KR') + '원 × ' + item.qty + '개'"></p>
              </div>
              <p class="text-sm font-bold text-gray-800 flex-shrink-0"
                 x-text="(item.price * item.qty).toLocaleString('ko-KR') + '원'"></p>
            </div>
          </template>
        </div>
      </div>

      <!-- 주문자 정보 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 bg-gray-50">
          <h2 class="font-bold text-gray-800 flex items-center gap-2">
            <i class="fas fa-user text-primary"></i>
            주문자 정보
          </h2>
        </div>
        <div class="px-5 py-5 space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">이름 <span class="text-accent">*</span></label>
            <input type="text" x-model="form.name" placeholder="홍길동"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">연락처 <span class="text-accent">*</span></label>
            <input type="tel" x-model="form.phone" placeholder="010-0000-0000"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">배송 주소 <span class="text-accent">*</span></label>

            <!-- 우편번호 행 -->
            <div class="flex gap-2 mb-2">
              <input type="text" x-model="form.zipcode" placeholder="우편번호" readonly
                     class="w-32 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none bg-gray-50 text-gray-600 cursor-default">
              <button type="button" @click="searchAddress()"
                      class="flex-1 bg-primary text-white text-sm font-bold rounded-xl px-4 py-2.5 hover:bg-brand-dark transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-search text-xs"></i> 주소 검색
              </button>
            </div>

            <!-- 기본 주소 (자동 입력) -->
            <input type="text" x-model="form.address"
                   placeholder="주소 검색 버튼을 눌러 주소를 입력해 주세요" readonly
                   @click="searchAddress()"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none bg-gray-50 text-gray-700 cursor-pointer hover:border-primary transition-colors mb-2">

            <!-- 상세 주소 (수동 입력) -->
            <input id="addressDetail" type="text" x-model="form.addressDetail"
                   placeholder="상세 주소를 입력해 주세요 (동·호수·층 등)"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">

            <!-- 도로명/지번 표시 -->
            <p x-show="form.addressType" class="text-xs text-gray-400 mt-1.5 flex items-center gap-1">
              <i class="fas fa-map-marker-alt text-accent text-[10px]"></i>
              <span x-text="form.addressType === 'R' ? '도로명 주소' : '지번 주소'"></span>
              <span x-show="form.buildingName" class="text-gray-500" x-text="'· ' + form.buildingName"></span>
            </p>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">배송 메모</label>
            <select x-model="form.memo"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-white">
              <option value="">메모를 선택하세요</option>
              <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
              <option value="경비실에 맡겨주세요">경비실에 맡겨주세요</option>
              <option value="전화 후 배송해 주세요">전화 후 배송해 주세요</option>
              <option value="직접 입력">직접 입력</option>
            </select>
            <input x-show="form.memo === '직접 입력'" type="text" x-model="form.memoCustom"
                   placeholder="배송 메모를 입력하세요"
                   class="mt-2 w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
          </div>
        </div>
      </div>

      <!-- 결제 수단 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 bg-gray-50">
          <h2 class="font-bold text-gray-800 flex items-center gap-2">
            <i class="fas fa-credit-card text-primary"></i>
            결제 수단
          </h2>
        </div>
        <div class="px-5 py-5">
          <div class="grid grid-cols-2 gap-3">

            <!-- 온라인 카드 -->
            <button type="button"
                    @click="method = 'card'"
                    :class="method === 'card' ? 'selected' : ''"
                    class="method-btn flex flex-col items-center gap-2 p-4 border-2 border-gray-200 rounded-xl hover:border-primary transition-all">
              <i class="fas fa-credit-card text-2xl" :class="method==='card' ? 'text-primary' : 'text-gray-400'"></i>
              <span class="text-sm font-bold">온라인 카드</span>
              <span class="text-xs text-gray-400">신용·체크카드</span>
            </button>

            <!-- 계좌이체 -->
            <button type="button"
                    @click="method = 'transfer'"
                    :class="method === 'transfer' ? 'selected' : ''"
                    class="method-btn flex flex-col items-center gap-2 p-4 border-2 border-gray-200 rounded-xl hover:border-primary transition-all">
              <i class="fas fa-university text-2xl" :class="method==='transfer' ? 'text-primary' : 'text-gray-400'"></i>
              <span class="text-sm font-bold">계좌이체</span>
              <span class="text-xs text-gray-400">실시간 이체</span>
            </button>

            <!-- 만나서 카드 -->
            <button type="button"
                    @click="method = 'meet_card'"
                    :class="method === 'meet_card' ? 'selected' : ''"
                    class="method-btn flex flex-col items-center gap-2 p-4 border-2 border-gray-200 rounded-xl hover:border-primary transition-all">
              <i class="fas fa-handshake text-2xl" :class="method==='meet_card' ? 'text-primary' : 'text-gray-400'"></i>
              <span class="text-sm font-bold">만나서 카드</span>
              <span class="text-xs text-gray-400">배달 시 카드 결제</span>
            </button>

            <!-- 만나서 현금 -->
            <button type="button"
                    @click="method = 'meet_cash'"
                    :class="method === 'meet_cash' ? 'selected' : ''"
                    class="method-btn flex flex-col items-center gap-2 p-4 border-2 border-gray-200 rounded-xl hover:border-primary transition-all">
              <i class="fas fa-money-bill-wave text-2xl" :class="method==='meet_cash' ? 'text-primary' : 'text-gray-400'"></i>
              <span class="text-sm font-bold">만나서 현금</span>
              <span class="text-xs text-gray-400">배달 시 현금 결제</span>
            </button>

          </div>

          <!-- 만나서 결제 안내 -->
          <div x-show="method === 'meet_card' || method === 'meet_cash'"
               class="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-xl text-sm text-yellow-800">
            <i class="fas fa-info-circle mr-1"></i>
            배달 시 기사에게 직접 결제해 주세요. 주문 접수 후 담당자가 연락드립니다.
          </div>

          <!-- 온라인 결제 안내 -->
          <div x-show="method === 'card' || method === 'transfer'"
               class="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800">
            <i class="fas fa-lock mr-1"></i>
            토스페이먼츠 안전결제 시스템으로 처리됩니다.
            <span class="text-xs block mt-1 text-blue-600">
              ※ 로컬 서버(npx serve . 등)에서 실행 시 결제 테스트가 가능합니다.
            </span>
          </div>
        </div>
      </div>

    </div>

    <!-- 오른쪽: 결제 요약 -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden sticky top-24">
        <div class="px-5 py-4 border-b border-gray-100 bg-gray-50">
          <h2 class="font-bold text-gray-800">결제 요약</h2>
        </div>
        <div class="px-5 py-5 space-y-3">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">상품 합계</span>
            <span class="font-medium" x-text="$store.cart.totalFormatted + '원'"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500">배송비</span>
            <span class="font-medium text-green-600">무료</span>
          </div>
          <div class="border-t border-gray-100 pt-3 flex justify-between items-center">
            <span class="font-bold text-gray-800">최종 결제금액</span>
            <span class="text-xl font-black text-accent" x-text="$store.cart.totalFormatted + '원'"></span>
          </div>
        </div>

        <!-- 최소 주문금액 안내 -->
        <div x-show="$store.cart.total < 100000"
             class="mx-5 mb-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-center gap-2">
          <i class="fas fa-exclamation-circle text-accent flex-shrink-0"></i>
          <p class="text-sm text-red-600">
            최소 주문금액은 <strong>100,000원</strong>입니다.<br>
            <span class="text-xs text-red-400" x-text="'현재 ' + $store.cart.totalFormatted + '원 · ' + (100000 - $store.cart.total).toLocaleString('ko-KR') + '원 더 담으면 주문 가능합니다.'"></span>
          </p>
        </div>

        <!-- 결제 버튼 -->
        <div class="px-5 pb-5">
          <button @click="pay()"
                  :disabled="loading || $store.cart.total < 100000"
                  class="w-full bg-accent text-white font-bold py-4 rounded-xl hover:bg-red-700 transition-colors text-base shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            <span x-show="!loading">
              <i class="fas fa-lock mr-1"></i>
              <span x-text="payBtnLabel()"></span>
            </span>
            <span x-show="loading">
              <i class="fas fa-spinner fa-spin mr-1"></i> 처리 중...
            </span>
          </button>
          <p class="text-xs text-center text-gray-400 mt-3">
            주문 시 <a href="#" class="underline">이용약관</a> 및 <a href="#" class="underline">개인정보처리방침</a>에 동의합니다.
          </p>
        </div>

      </div>
    </div>

  </div><!-- grid -->
</div>

<!-- ===== Alpine 컴포넌트 ===== -->
<script>
  function checkoutApp() {
    return {
      method: 'card',
      loading: false,
      form: {
        name: '',
        phone: '',
        zipcode: '',
        address: '',
        addressDetail: '',
        addressType: '',
        buildingName: '',
        memo: '',
        memoCustom: ''
      },

      init() {
        // 로그인 체크
        const session = JSON.parse(localStorage.getItem('pilmart_session') || 'null');
        if (!session) {
          window.location.href = 'auth.html?redirect=checkout.html';
          return;
        }
        // 세션 정보로 폼 자동 완성
        this.form.name  = session.name  || '';
        this.form.phone = session.phone || '';
      },

      payBtnLabel() {
        const labels = {
          card:      '카드로 결제하기',
          transfer:  '계좌이체로 결제하기',
          meet_card: '주문 접수 (만나서 카드)',
          meet_cash: '주문 접수 (만나서 현금)'
        };
        return labels[this.method] || '결제하기';
      },

      searchAddress() {
        new daum.Postcode({
          oncomplete: (data) => {
            this.form.zipcode     = data.zonecode;
            this.form.address     = data.roadAddress || data.jibunAddress;
            this.form.addressType = data.addressType;
            this.form.buildingName = data.buildingName || '';
            this.$nextTick(() => {
              document.getElementById('addressDetail').focus();
            });
          },
          theme: {
            searchButton: '#1a3d8f'
          }
        }).open();
      },

      validate() {
        if (!this.form.name.trim())          { alert('이름을 입력해 주세요.'); return false; }
        if (!this.form.phone.trim())         { alert('연락처를 입력해 주세요.'); return false; }
        if (!this.form.address.trim())       { alert('주소 검색을 통해 배송 주소를 입력해 주세요.'); return false; }
        if (!this.form.addressDetail.trim()) { alert('상세 주소를 입력해 주세요.'); return false; }
        if (!this.method)                    { alert('결제 수단을 선택해 주세요.'); return false; }
        return true;
      },

      async pay() {
        if (this.$store.cart.total < 100000) {
          alert('최소 주문금액은 100,000원입니다.\n' + (100000 - this.$store.cart.total).toLocaleString('ko-KR') + '원 더 담아주세요.');
          return;
        }
        if (!this.validate()) return;
        this.loading = true;

        // 주문 내역 저장용 스냅샷 (success.html에서 읽어 기록)
        localStorage.setItem('pilmart_pending_order', JSON.stringify({
          items: this.$store.cart.items,
          total: this.$store.cart.total,
          name: this.form.name,
          phone: this.form.phone,
          zipcode: this.form.zipcode,
          address: this.form.address + ' ' + this.form.addressDetail,
          paymentMethod: this.method
        }));

        try {
          if (this.method === 'card' || this.method === 'transfer') {
            // ── Toss Payments 온라인 결제 ──────────────────────────
            const tossMethod = this.method === 'card' ? '카드' : '계좌이체';
            const orderId = 'PILMART-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6).toUpperCase();

            await requestTossPayment(tossMethod, {
              amount:       this.$store.cart.total,
              orderId:      orderId,
              orderName:    '필마트 주문 ' + this.$store.cart.count + '건',
              customerName: this.form.name,
              customerMobilePhone: this.form.phone.replace(/-/g, '')
            });
            // 성공 시 Toss가 success.html 로 리디렉션 처리
          } else {
            // ── 만나서 결제 (오프라인) ─────────────────────────────
            const methodLabel = this.method === 'meet_card' ? '카드' : '현금';
            alert(`주문이 접수되었습니다!\n\n배달 시 ${methodLabel}로 결제해 주세요.\n담당자가 곧 연락드립니다.`);
            this.$store.cart.clearCart();
            window.location.href = 'success.html?type=meet&method=' + methodLabel;
          }
        } catch (err) {
          // 사용자가 결제창을 닫은 경우 등
          console.error(err);
          if (err.code !== 'USER_CANCEL') {
            alert('결제 중 오류가 발생했습니다: ' + (err.message || '알 수 없는 오류'));
          }
          this.loading = false;
        }
      }
    };
  }
</script>

</body>
</html>
