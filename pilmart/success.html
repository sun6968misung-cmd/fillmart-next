<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 완료 — 필마트</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#1a3d8f', accent: '#e8001d' } } }
    }
  </script>
  <script src="js/store.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body x-data="successApp()" class="bg-gray-50 min-h-screen flex flex-col font-sans">

<header class="bg-white shadow-sm">
  <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
    <img src="images/logo.svg" class="h-9" alt="FILLMART">
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-10 max-w-md w-full text-center">

    <!-- 성공 아이콘 -->
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fas fa-check text-3xl text-green-500"></i>
    </div>

    <h1 class="text-2xl font-black text-gray-800 mb-2">주문이 완료되었습니다!</h1>
    <p class="text-gray-500 mb-6 text-sm" x-text="subtitle"></p>

    <!-- 주문 정보 -->
    <div class="bg-gray-50 rounded-xl p-4 text-left space-y-2 mb-6 text-sm">
      <div class="flex justify-between">
        <span class="text-gray-500">주문번호</span>
        <span class="font-mono font-semibold text-gray-800" x-text="orderId || '-'"></span>
      </div>
      <div x-show="paymentKey" class="flex justify-between">
        <span class="text-gray-500">결제키</span>
        <span class="font-mono text-xs text-gray-600 truncate max-w-[160px]" x-text="paymentKey"></span>
      </div>
      <div x-show="amount" class="flex justify-between">
        <span class="text-gray-500">결제금액</span>
        <span class="font-bold text-accent" x-text="Number(amount).toLocaleString('ko-KR') + '원'"></span>
      </div>
    </div>

    <p class="text-xs text-gray-400 mb-8">
      주문 관련 문의: <a href="tel:053-593-8253" class="text-primary font-semibold">053-593-8253</a>
    </p>

    <a href="index.html"
       class="block w-full bg-primary text-white font-bold py-3.5 rounded-xl hover:bg-brand-dark transition-colors text-base">
      <i class="fas fa-home mr-2"></i>홈으로 돌아가기
    </a>
  </div>
</main>

<script>
  function successApp() {
    return {
      orderId: '',
      paymentKey: '',
      amount: '',
      subtitle: '',
      init() {
        const params = new URLSearchParams(window.location.search);
        this.orderId    = params.get('orderId')    || '';
        this.paymentKey = params.get('paymentKey') || '';
        this.amount     = params.get('amount')     || '';
        const type   = params.get('type');
        const method = params.get('method');

        // 주문 내역 저장 (카트 초기화 이전에 실행)
        const pending = JSON.parse(localStorage.getItem('pilmart_pending_order') || '{}');
        const order = {
          orderId: this.orderId || ('MEET-' + Date.now()),
          date: new Date().toISOString(),
          amount: this.amount || pending.total || 0,
          paymentMethod: method || pending.paymentMethod || '',
          items: pending.items || [],
          type: type || 'online'
        };
        const orders = JSON.parse(localStorage.getItem('pilmart_orders') || '[]');
        orders.unshift(order);
        localStorage.setItem('pilmart_orders', JSON.stringify(orders.slice(0, 30)));
        localStorage.removeItem('pilmart_pending_order');

        // 카트 초기화
        this.$store.cart.clearCart();

        if (type === 'meet') {
          this.subtitle = `배달 시 ${method || ''}로 결제해 주세요. 담당자가 곧 연락드립니다.`;
        } else {
          this.subtitle = '결제가 정상적으로 처리되었습니다. 빠르게 배송해 드리겠습니다.';
        }
      }
    };
  }
</script>

</body>
</html>
